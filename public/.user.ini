; Bilis - PHP tuning for PHP-FPM / CGI (reads .user.ini, mod_php ignores this)
; Place in public/.user.ini. App still enforces 100 MB in config/config.php.
max_execution_time = 60
max_input_time = 60
memory_limit = 256M
post_max_size = 150M
upload_max_filesize = 150M
output_buffering = Off
zlib.output_compression = Off
implicit_flush = On
