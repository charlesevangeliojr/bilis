# Bilis - Nginx (production)
# Docroot must be .../Bilis/public
# Test: nginx -t -c /etc/nginx/nginx.conf
# Reload: nginx -s reload

server {
    listen 80;
    server_name speed.example.com;

    root "C:/Users/Chazu/Documents/Side project/Bilis/public";
    # Linux example: root /var/www/Bilis/public;
    index index.html;

    # --- Global speed tuning ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    send_timeout 30s;

    gzip off;             # never compress speed payloads
    access_log off;       # disk I/O skews results

    # App enforces 100 MB in config/config.php.
    # 0 = unlimited at nginx layer so nginx is not the bottleneck.
    client_max_body_size 0;
    client_body_buffer_size 256k;
    client_body_timeout 30s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Download: no buffering ---
    location = /api/download.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        # Windows / XAMPP example:
        # fastcgi_pass 127.0.0.1:9000;

        fastcgi_buffering off;
        fastcgi_max_temp_file_size 0;
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;

        # PHP sees these via fastcgi_param
        fastcgi_param PHP_VALUE "max_execution_time=60\nmemory_limit=256M\noutput_buffering=Off\nzlib.output_compression=Off";

        add_header Cache-Control "no-store" always;
    }

    # --- Upload: accept large bodies, stream to PHP ---
    location = /api/upload.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;

        client_max_body_size 0;       # bypass limit here, PHP app checks 100 MB
        client_body_buffer_size 256k; # small buffer -> stream, less RAM
        fastcgi_request_buffering off;# stream body to PHP, don't pre-buffer
        fastcgi_buffering off;
        fastcgi_max_temp_file_size 0;
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;

        fastcgi_param PHP_VALUE "max_execution_time=60\nmax_input_time=60\nmemory_limit=256M\npost_max_size=150M\nupload_max_filesize=150M\noutput_buffering=Off\nzlib.output_compression=Off";
    }

    location = /api/ping.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }

    location = /api/settings.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        add_header Cache-Control "no-store" always;
    }

    location ~ \.php$ {
        return 404; # block any other PHP entrypoint
    }
}
