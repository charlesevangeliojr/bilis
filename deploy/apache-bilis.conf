# Bilis - Apache vhost (production)
# Enable: headers, deflate (to be able to disable), reqtimeout
#   a2enmod headers deflate reqtimeout proxy_fcgi setenvif
<VirtualHost *:80>
    ServerName speed.example.com
    DocumentRoot "C:/Users/Chazu/Documents/Side project/Bilis/public"
    # Linux example: DocumentRoot /var/www/Bilis/public

    <Directory "C:/Users/Chazu/Documents/Side project/Bilis/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # --- Bypass limits: let the PHP app (100 MB) be the only gate ---
    LimitRequestBody 0
    Timeout 60
    KeepAlive On
    MaxKeepAliveRequests 100
    KeepAliveTimeout 5

    # Loosen mod_reqtimeout so slow clients are not cut off mid-test
    <IfModule reqtimeout_module>
        RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
    </IfModule>

    # Never compress /api payloads (compression destroys speed accuracy)
    <Location /api/>
        SetEnv no-gzip 1
        SetEnv dont-vary 1
        Header set Cache-Control "no-store"
    </Location>

    # PHP-FPM via proxy (preferred over mod_php for streaming)
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/var/run/php/php8.3-fpm.sock|fcgi://localhost"
        # XAMPP example:
        # SetHandler application/x-httpd-php
    </FilesMatch>

    # PHP limits bypassed at server layer (app still enforces 100 MB)
    <IfModule mod_php.c>
        php_value max_execution_time 60
        php_value max_input_time 60
        php_value memory_limit 256M
        php_value post_max_size 150M
        php_value upload_max_filesize 150M
        php_flag output_buffering Off
        php_flag zlib.output_compression Off
    </IfModule>

    # Don't log every speed chunk to disk (I/O skews results)
    # CustomLog /dev/null combined
    ErrorLog ${APACHE_LOG_DIR}/bilis-error.log
</VirtualHost>
